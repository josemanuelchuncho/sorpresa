<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxia Animada - LIZ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0d0221 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .galaxy-container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sun {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle at 30% 30%, #ffff00, #ffa500, #ff6000);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 165, 0, 0.8);
            box-shadow: 0 0 60px rgba(255, 165, 0, 0.6),
                        0 0 100px rgba(255, 100, 0, 0.4),
                        inset -20px -20px 40px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: sunPulse 3s ease-in-out infinite;
            cursor: pointer;
        }

        .sun:hover {
            filter: brightness(1.2);
        }

        .click-message {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: #ffff00;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.8);
            animation: pulse-text 1.5s ease-in-out infinite;
            white-space: nowrap;
        }

        @keyframes pulse-text {
            0%, 100% {
                opacity: 0.6;
                transform: translateX(-50%) translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateX(-50%) translateY(-5px);
            }
        }

        @keyframes sunPulse {
            0%, 100% {
                box-shadow: 0 0 60px rgba(255, 165, 0, 0.6),
                            0 0 100px rgba(255, 100, 0, 0.4),
                            inset -20px -20px 40px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 80px rgba(255, 165, 0, 0.8),
                            0 0 120px rgba(255, 100, 0, 0.6),
                            inset -20px -20px 40px rgba(0, 0, 0, 0.3);
            }
        }

        .orbit {
            position: absolute;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .orbit-1 {
            width: 200px;
            height: 200px;
            animation: rotate 20s linear infinite;
        }

        .orbit-2 {
            width: 300px;
            height: 300px;
            animation: rotate 30s linear infinite reverse;
        }

        .orbit-3 {
            width: 400px;
            height: 400px;
            animation: rotate 45s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: translate(-50%, -50%) rotate(0deg);
            }
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .planet {
            position: absolute;
            border-radius: 50%;
            top: 50%;
            left: 50%;
        }

        .planet-1 {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle at 35% 35%, #4a90e2, #2c5aa0);
            left: calc(50% + 100px);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(74, 144, 226, 0.6);
        }

        .planet-2 {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 35% 35%, #e2974a, #a0602c);
            left: calc(50% + 150px);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(226, 151, 74, 0.5);
        }

        .planet-3 {
            width: 25px;
            height: 25px;
            background: radial-gradient(circle at 35% 35%, #7cb342, #558b2f);
            left: calc(50% + 200px);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 15px rgba(124, 179, 66, 0.5);
        }

        .planet-4 {
            width: 35px;
            height: 35px;
            background: radial-gradient(circle at 35% 35%, #f44336, #c62828);
            left: calc(50% + 150px);
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
        }

        .star.twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 40px;
            z-index: 100;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-300px) scale(0.5);
            }
        }

        .heart.float {
            animation: floatUp 2s ease-out forwards;
        }

        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        @keyframes burst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .particle.burst {
            animation: burst 1.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="galaxy-container">
        <!-- Órbitas -->
        <div class="orbit orbit-1"></div>
        <div class="orbit orbit-2"></div>
        <div class="orbit orbit-3"></div>

        <!-- Planetas en órbita 1 -->
        <div class="orbit orbit-1" style="pointer-events: none;">
            <div class="planet planet-1"></div>
        </div>

        <!-- Planetas en órbita 2 -->
        <div class="orbit orbit-2" style="pointer-events: none;">
            <div class="planet planet-2"></div>
        </div>

        <!-- Planetas en órbita 3 -->
        <div class="orbit orbit-3" style="pointer-events: none;">
            <div class="planet planet-3"></div>
        </div>

        <!-- Planetas adicionales -->
        <div class="orbit orbit-2" style="pointer-events: none; animation-direction: reverse;">
            <div class="planet planet-4"></div>
        </div>

        <!-- Sol central con texto LIZ -->
        <div class="sun">LIZ
            <div class="click-message">Presione aquí</div>
        </div>
    </div>

    <script>
        // Generar estrellas de fondo
        const container = document.querySelector('.galaxy-container');
        
        function createStars() {
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.className = 'star twinkle';
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                star.style.animationDelay = Math.random() * 3 + 's';
                document.body.appendChild(star);
            }
        }

        createStars();

        // Función para crear corazones al hacer clic
        function createHearts(event) {
            const sun = document.querySelector('.sun');
            const rect = sun.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;

            // Crear corazones principales
            for (let i = 0; i < 12; i++) {
                const heart = document.createElement('div');
                heart.className = 'heart float';
                heart.innerHTML = '❤️';
                
                heart.style.left = centerX + 'px';
                heart.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * i) / 12;
                const velocity = 5;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;
                
                document.body.appendChild(heart);
                
                let x = centerX;
                let y = centerY;
                let frame = 0;
                const frames = 60;
                
                const animate = () => {
                    frame++;
                    x += vx;
                    y -= 5;
                    const opacity = 1 - (frame / frames);
                    const scale = 1 - (frame / frames) * 0.5;
                    
                    heart.style.left = x + 'px';
                    heart.style.top = y + 'px';
                    heart.style.opacity = opacity;
                    heart.style.transform = `scale(${scale})`;
                    
                    if (frame < frames) {
                        requestAnimationFrame(animate);
                    } else {
                        heart.remove();
                    }
                };
                
                animate();
            }

            // Crear fuegos artificiales de partículas
            createFireworks(centerX, centerY);
        }

        // Función para crear fuegos artificiales
        function createFireworks(centerX, centerY) {
            const colors = ['#ff6b9d', '#ff00ff', '#ffff00', '#00ff88', '#00d4ff', '#ff4444'];
            const particleCount = 40;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle burst';
                
                // Emojis para fuegos artificiales
                const fireworkEmojis = ['✨', '⭐', '💫', '🌟', '✨', '⚡', '💥'];
                particle.innerHTML = fireworkEmojis[Math.floor(Math.random() * fireworkEmojis.length)];
                particle.style.fontSize = Math.random() * 20 + 15 + 'px';
                
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * Math.random());
                const distance = Math.random() * 300 + 100;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                particle.style.setProperty('--tx', tx + 'px');
                particle.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }

            // Efecto de explosión adicional con luces
            for (let i = 0; i < 20; i++) {
                const light = document.createElement('div');
                light.className = 'particle burst';
                light.style.width = '8px';
                light.style.height = '8px';
                light.style.borderRadius = '50%';
                light.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                light.style.boxShadow = `0 0 10px ${light.style.backgroundColor}`;
                
                light.style.left = centerX + 'px';
                light.style.top = centerY + 'px';
                
                const angle = (Math.PI * 2 * Math.random());
                const distance = Math.random() * 250 + 80;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance;
                
                light.style.setProperty('--tx', tx + 'px');
                light.style.setProperty('--ty', ty + 'px');
                
                document.body.appendChild(light);
                
                setTimeout(() => {
                    light.remove();
                }, 1500);
            }
        }

        // Event listener para hacer clic en el sol
        document.querySelector('.sun').addEventListener('click', createHearts);

        // Añadir interactividad opcional
        document.addEventListener('mousemove', (e) => {
            const galaxyContainer = document.querySelector('.galaxy-container');
            const rect = galaxyContainer.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
            const distance = Math.sqrt(
                Math.pow(e.clientX - centerX, 2) + 
                Math.pow(e.clientY - centerY, 2)
            );
            
            if (distance < 500) {
                galaxyContainer.style.transform = `perspective(1000px) rotateX(${Math.sin(angle) * 5}deg) rotateY(${Math.cos(angle) * 5}deg)`;
            }
        });

        document.addEventListener('mouseleave', () => {
            document.querySelector('.galaxy-container').style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
        });
    </script>
</body>
</html>
